name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      filename: ${{ steps.digest.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require release source to match provenance source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: node scripts/verify-npm-publication.mjs "$(npm root --global)/npm"
      # The smoke creates a runtime-only shrinkwrap and retains the exact
      # verified tarball. No subsequent packing or lifecycle step can alter it.
      - run: npm run smoke:package -- --release-artifact-directory "$RUNNER_TEMP/release-artifact"
      - name: Record verified artifact digest
        id: digest
        working-directory: ${{ runner.temp }}/release-artifact
        run: |
          set -- codex-unlock-*.tgz
          test "$#" -eq 1 && test -f "$1"
          printf 'filename=%s\n' "$1" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: npm-release
          path: ${{ runner.temp }}/release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, project dependency installation, build, or lifecycle hooks
      # run in this job. The npm Trusted Publisher workflow binding is unchanged.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-release.outputs.artifact_id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - name: Verify transferred bytes and publish without lifecycle scripts
        working-directory: ${{ runner.temp }}/npm-release
        env:
          TARBALL: ${{ needs.build-release.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.build-release.outputs.sha256 }}
        run: |
          test "$(npm --version)" = 11.11.0
          [[ "$TARBALL" =~ ^codex-unlock-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "$TARBALL" | sha256sum --check --strict
          npm publish "./$TARBALL" --ignore-scripts --provenance --access public --registry https://registry.npmjs.org
