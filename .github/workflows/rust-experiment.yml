name: Rust experiment

on:
  pull_request:
    branches: [main, research/rust-windows-experiment]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixture-locks:
    name: Rust fixture locks (${{ matrix.runner }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: experimental/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned experimental toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo test --locked --offline
        env:
          CODEX_UNLOCK_LAB_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Exercise fixture-only CLI
        run: |
          cargo run --locked --offline -- capabilities
          cargo run --locked --offline -- self-test --scratch-root "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: runner.os != 'Windows'
        with:
          node-version: '22.13.0'
      - name: Compare Rust and production TypeScript lock adapters
        if: runner.os != 'Windows'
        working-directory: .
        env:
          CODEX_UNLOCK_LAB_SCRATCH_ROOT: ${{ runner.temp }}
        run: |
          npm ci
          npm run build
          node experimental/rust/interop.mjs
