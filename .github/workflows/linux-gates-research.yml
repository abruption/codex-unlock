name: Linux attribution research gates

on:
  pull_request:
    paths:
      - '.github/workflows/linux-gates-research.yml'
      - 'experimental/126-linux-gates/**'
      - 'experimental/126-guard-liveness/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-models-and-kernel:
    name: Models and synthetic Linux lock observations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # Only built-in Node modules and Python stdlib. These tests do not load
      # a Codex binary or the product, and do not establish unlock eligibility.
      - run: node --test experimental/126-linux-gates/*/*.test.mjs
