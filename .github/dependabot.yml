version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The native runtime dependency is pinned exactly; bump that pin (and
    # package-lock.json) instead of widening it into a range.
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      # Consumers only receive a new runtime pin in a release, so runtime bumps
      # are release-worthy fixes; development-only bumps stay chores.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Keep native runtime updates in their own PR so each version passes the
      # full platform matrix and package smoke on its own before release.
      runtime:
        dependency-type: production
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
